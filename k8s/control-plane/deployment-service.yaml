---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: triton-models-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: /data/triton-models
  storageClassName: local-storage

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: triton-models-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-storage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployment-service
  template:
    metadata:
      labels:
        app: deployment-service
    spec:
      containers:
      - name: deployment-service
        image: deployment-service:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: S3_ENDPOINT
          value: "http://minio:9000"
        - name: S3_ACCESS_KEY
          value: "minioadmin"
        - name: S3_SECRET_KEY
          value: "minioadmin"
        - name: S3_BUCKET
          value: "models"
        - name: TRITON_URL
          value: "triton:8000"
        - name: TRITON_MODEL_REPO
          value: "/models"
        - name: MODEL_REGISTRY_URL
          value: "http://model-registry:8001"
        - name: CONFIG_SERVICE_URL
          value: "http://config-service:8002"
        - name: SERVICE_PORT
          value: "8003"
        ports:
        - containerPort: 8003
          name: http
        volumeMounts:
        - name: models
          mountPath: /models
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: triton-models-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: deployment-service
  namespace: default
spec:
  selector:
    app: deployment-service
  ports:
  - name: http
    port: 8003
    targetPort: 8003
  type: ClusterIP
