apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-service
  labels:
    app: deployment-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: deployment-service
  template:
    metadata:
      labels:
        app: deployment-service
    spec:
      containers:
        - name: deployment-service
          image: your-docker-repo/deployment-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: TRITON_SERVER_URL
              value: "triton-server:8001"
            - name: MODEL_REPO_PATH
              value: "/models"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: deployment-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: deployment-service