---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-registry
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-registry
  template:
    metadata:
      labels:
        app: model-registry
    spec:
      containers:
      - name: model-registry
        image: model-registry:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow:5000"
        - name: SERVICE_PORT
          value: "8001"
        ports:
        - containerPort: 8001
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: model-registry
  namespace: default
spec:
  selector:
    app: model-registry
  ports:
  - name: http
    port: 8001
    targetPort: 8001
  type: ClusterIP
