---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
    spec:
      containers:
      - name: config-service
        image: config-service:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SERVICE_PORT
          value: "8002"
        ports:
        - containerPort: 8002
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: config-service
  namespace: default
spec:
  selector:
    app: config-service
  ports:
  - name: http
    port: 8002
    targetPort: 8002
  type: ClusterIP
