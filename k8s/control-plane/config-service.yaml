apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  labels:
    app: config-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
    spec:
      containers:
      - name: config-service
        image: your-docker-repo/config-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: CONFIG_SERVICE_ENV
          value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: config-service
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: config-service